name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Verify committed model artifact
        run: |
          python scripts/train_model.py --samples 20000 --fraud-rate 0.08 --seed 42 --output /tmp/fraud_logreg_v1.json
          python scripts/verify_model_artifact.py models/fraud_logreg_v1.json /tmp/fraud_logreg_v1.json

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    needs: [python, compose]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,storage]"
      - name: Start integration stack
        run: docker compose up -d --build kafka postgres transaction-api detector decision-store
      - name: Verify API to Kafka to detector to PostgreSQL
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: pytest tests/integration/test_live_pipeline.py
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Stop integration stack
        if: always()
        run: docker compose down -v
