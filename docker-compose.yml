name: real-time-fraud-detection

services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - fraud-network

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: fraud-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.raw --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.scored --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic fraud.alerts --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions.dead_letter --partitions 1 --replication-factor 1
    networks:
      - fraud-network

  postgres:
    image: postgres:17-alpine
    container_name: fraud-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_detection}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fraud-network

  transaction-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: fraud-transaction-api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSACTIONS_TOPIC: transactions.raw
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fraud-network

  detector:
    build:
      context: .
      dockerfile: services/detector/Dockerfile
    container_name: fraud-detector
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TRANSACTIONS_TOPIC: transactions.raw
      FRAUD_DECISIONS_TOPIC: transactions.scored
      FRAUD_ALERTS_TOPIC: fraud.alerts
      DEAD_LETTER_TOPIC: transactions.dead_letter
      METRICS_PORT: 9101
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - fraud-network

  decision-store:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    container_name: fraud-decision-store
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRAUD_DECISIONS_TOPIC: transactions.scored
      DEAD_LETTER_TOPIC: transactions.dead_letter
      DATABASE_URL: postgresql://fraud_app:fraud_dev_password@postgres:5432/fraud_detection
      METRICS_PORT: 9102
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9102/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - fraud-network

  alerter:
    build:
      context: .
      dockerfile: services/alerter/Dockerfile
    container_name: fraud-alerter
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRAUD_ALERTS_TOPIC: fraud.alerts
      DEAD_LETTER_TOPIC: transactions.dead_letter
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      METRICS_PORT: 9103
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9103/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - fraud-network

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: fraud-dashboard
    depends_on:
      decision-store:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fraud_app:fraud_dev_password@postgres:5432/fraud_detection
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - fraud-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: fraud-prometheus
    depends_on:
      detector:
        condition: service_healthy
      decision-store:
        condition: service_healthy
      alerter:
        condition: service_healthy
      transaction-api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fraud-network

networks:
  fraud-network:
    name: fraud-network

volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
