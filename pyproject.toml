[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-fraud-detection-pipeline"
version = "0.1.0"
description = "Local-first streaming fraud detection portfolio project"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.6,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
storage = [
  "psycopg[binary]>=3.2,<4",
]
ml = [
  "scikit-learn>=1.6,<2",
]
dashboard = [
  "pandas>=2.2,<4",
  "plotly>=6,<7",
  "psycopg[binary]>=3.2,<4",
  "streamlit>=1.42,<2",
]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires the live Docker Compose stack",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
